name: Reservations Service CI

on:
  push:
    paths:
      - "rezervacije/**"
  pull_request:
    paths:
      - "rezervacije/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd rezervacije
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd rezervacije
          pytest
