name: Docker Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - "inventar/**"
      - "rezervacije/**"
      - "uporabniki/**"
      - "web-bff/**"
      - "mobile-bff/**"
      - "web-ui/**"
      - "inventory-ui/**"
      - "reservations-ui/**"
      - "users-ui/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: inventar
            image: inventory-service
          - context: rezervacije
            image: reservations-service
          - context: uporabniki
            image: users-service
          - context: web-bff
            image: web-bff
          - context: mobile-bff
            image: mobile-bff
          - context: web-ui
            image: web-ui-shell
          - context: inventory-ui
            image: inventory-ui
          - context: reservations-ui
            image: reservations-ui
          - context: users-ui
            image: users-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/digitalni-inventurni-sistem-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
