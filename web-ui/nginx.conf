server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location ~* \.(js|css|html|json)$ {
    add_header Cache-Control "no-store";
  }

  location /api-gateway/ {
    proxy_pass http://web-bff:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /inventory-remote/ {
    proxy_pass http://inventory-ui:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /reservations-remote/ {
    proxy_pass http://reservations-ui:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /users-remote/ {
    proxy_pass http://users-ui:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
