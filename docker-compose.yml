services:
  inventory-db:
    image: postgres:15.17
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data

  inventory-service:
    build: ./inventar
    container_name: inventory-service
    depends_on:
      - inventory-db
    environment:
      PORT: 8000
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventorydb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8000:8000"
      - "50051:50051"

  reservations-db:
    image: postgres:15.17
    container_name: reservations-db
    environment:
      POSTGRES_DB: reservationsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - reservations_postgres_data:/var/lib/postgresql/data

  reservations-service:
    build: ./rezervacije
    container_name: reservations-service
    depends_on:
      - reservations-db
      - inventory-service
    environment:
      DB_HOST: reservations-db
      DB_PORT: 5432
      DB_NAME: reservationsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      INVENTORY_GRPC_HOST: inventory-service:50051
    ports:
      - "8001:8001"

volumes:
  inventory_postgres_data:
  reservations_postgres_data:
